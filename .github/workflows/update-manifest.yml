name: Update Projects Manifest

on:
  push:
    paths:
      - 'projects/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Generate Manifest
        run: |
          # Collect project directories
          projects=()
          for dir in projects/*/; do
            dirname=$(basename "$dir")
            if [ -d "$dir" ]; then
              projects+=("\"$dirname\"")
            fi
          done
          
          # Create proper JSON with correct formatting
          if [ ${#projects[@]} -eq 0 ]; then
            echo '[]' > projects/manifest.json
          else
            echo '[' > projects/manifest.json
            for i in "${!projects[@]}"; do
              if [ $i -eq $((${#projects[@]} - 1)) ]; then
                echo "  ${projects[$i]}" >> projects/manifest.json
              else
                echo "  ${projects[$i]}," >> projects/manifest.json
              fi
            done
            echo ']' >> projects/manifest.json
          fi
          
          cat projects/manifest.json
      
      - name: Commit and Push Manifest
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add projects/manifest.json
          git diff --cached --quiet || git commit -m "chore: update projects manifest"
          git push
