name: Update Projects Manifest

on:
  push:
    paths:
      - 'projects/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Generate Manifest
        run: |
          # Collect project directories
          projects=()
          for dir in projects/*/; do
            dirname=$(basename "$dir")
            if [ -d "$dir" ] && [ "$dirname" != "manifest.json" ]; then
              projects+=("\"$dirname\"")
            fi
          done
          
          # Create proper JSON
          if [ ${#projects[@]} -eq 0 ]; then
            echo '[]' > projects/manifest.json
          else
            printf '[\n  %s\n]\n' "$(IFS=', '; echo "${projects[*]}")" > projects/manifest.json
          fi
      
      - name: Commit Manifest
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add projects/manifest.json
          git commit -m "Auto-update projects manifest" || exit 0
          git push
