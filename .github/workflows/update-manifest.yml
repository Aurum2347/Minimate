name: Update Projects Manifest

on:
  push:
    paths:
      - 'projects/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Generate Manifest
        run: |
          echo "[" > projects/manifest.json
          first=true
          for dir in projects/*/; do
            dirname=$(basename "$dir")
            if [ "$dirname" != "manifest.json" ] && [ -d "$dir" ]; then
              if [ "$first" = true ]; then
                first=false
              else
                echo "," >> projects/manifest.json
              fi
              echo "  \"$dirname\"" >> projects/manifest.json
            fi
          done
          echo "]" >> projects/manifest.json
      
      - name: Commit Manifest
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add projects/manifest.json
          git commit -m "Auto-update projects manifest" || exit 0
          git push
